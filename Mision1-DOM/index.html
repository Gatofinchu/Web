<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres en Raya: Cazador de Jefes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">
    <h1>Tres en Raya: Cazador de Jefes</h1>
    <p class="subtitulo">Vence a los 3 jefes. Ten cuidado: hacen trampas.</p>

    <!-- Indicador del jefe actual y las vidas del jugador -->
    <div class="panel-estado">
      <span id="indicador-jefe">Jefe 1/3: Novato</span>
      <span id="indicador-vidas">Vidas: ❤️❤️❤️</span>
    </div>

    <!-- Marcador de partidas -->
    <div class="panel-estado">
      <span id="marcador">Rondas ganadas: 0</span>
    </div>

    <!-- Mensaje de estado del turno / resultado -->
    <p id="mensaje" class="mensaje">Tu turno</p>

    <!-- Tablero de 3x3. Los 9 data-index son la clave para identificar
         cada casilla desde JavaScript sin escribir 9 listeners distintos. -->
    <div id="tablero" class="tablero">
      <button class="casilla" data-index="0"></button>
      <button class="casilla" data-index="1"></button>
      <button class="casilla" data-index="2"></button>
      <button class="casilla" data-index="3"></button>
      <button class="casilla" data-index="4"></button>
      <button class="casilla" data-index="5"></button>
      <button class="casilla" data-index="6"></button>
      <button class="casilla" data-index="7"></button>
      <button class="casilla" data-index="8"></button>
    </div>

    <!-- Controles: habilidad del jugador y reinicio manual -->
    <div class="controles">
      <button id="boton-habilidad" class="boton boton-habilidad"></button>
      <button id="boton-reiniciar" class="boton boton-secundario">Reiniciar intento (tecla R)</button>
    </div>

    <p class="pista">Truco secreto: pulsa la tecla <kbd>D</kbd> para el modo oscuro.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
